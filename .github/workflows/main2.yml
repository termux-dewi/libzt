name: Build ZeroTier Rust Project

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Proyek Rust
      uses: actions/checkout@v4

    - name: Install Build Dependencies & Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git clang libclang-dev

    - name: Clone dan Build libzt C Core
      run: |
        git clone --recurse-submodules https://github.com/zerotier/libzt.git
        cd libzt
        ./build.sh host
        cd ..

    - name: Buat Folder Lib dan Salin libzt.a secara Otomatis
      run: |
        mkdir -p lib
        # Mencari file libzt.a di dalam folder libzt dan menyalinnya ke folder lib/
        find libzt -name "libzt.a" -exec cp {} lib/ \;
        
        echo "=== Mengecek isi folder lib/ ==="
        ls -la lib/

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Compile Proyek Rust (Cargo Release)
      run: |
        cargo build --release

    - name: Upload Hasil Build Lengkap
      uses: actions/upload-artifact@v4
      with:
        name: zt-project-complete-artifact
        path: |
          target/release/zt_project
          lib/
          libzt/include/
        retention-days: 30
